LIB_CWMSCRIPTURE_VERSION_LABEL="Alapértelmezett Biblia verzió"
LIB_CWMSCRIPTURE_VERSION_DESC="Alapértelmezett bibliai fordítási rövidítés (pl. kjv, web, nlt). Címkénként felülírható: {scripture kjv}János 3:16{/scripture}."
LIB_CWMSCRIPTURE_CACHE_LABEL="Gyorsítótár időtartama (nap)"
LIB_CWMSCRIPTURE_CACHE_DESC="A külső API-kból lekért szentírásrészek gyorsítótárazásának napjainak száma."

