; CWM Scripture Library - Admin strings
; Used by TranslationsmanagerField for the scripture management UI

; Section titles
LIB_CWMSCRIPTURE_PROVIDERS_TITLE="Bibliaszolgáltatók"
LIB_CWMSCRIPTURE_PROVIDERS_DESC="Külső bibliai szövegszolgáltatók engedélyezése vagy letiltása. Legalább egy szolgáltató (vagy helyi fordítások) szükséges a szentíráskereséshez."
LIB_CWMSCRIPTURE_SETTINGS_TITLE="Szentírás-beállítások"

; Provider fields
LIB_CWMSCRIPTURE_GETBIBLE_LABEL="GetBible.net szolgáltató engedélyezése"
LIB_CWMSCRIPTURE_GETBIBLE_DESC="Használd az ingyenes GetBible.net API-t a szentírások kereséséhez. Több mint 100 fordítást támogat. Nincs szükség API-kulcsra."
LIB_CWMSCRIPTURE_APIBIBLE_LABEL="API.Bible szolgáltató engedélyezése"
LIB_CWMSCRIPTURE_APIBIBLE_DESC="Használja az API.Bible (American Bible Society) API-t. Hozzáférést biztosít szerzői joggal védett fordításokhoz, mint például a NIV, az ESV és az NLT. API-kulcs szükséges."
LIB_CWMSCRIPTURE_APIKEY_LABEL="API.Bible API-kulcs"
LIB_CWMSCRIPTURE_APIKEY_DESC="Az API-kulcsod a scripture.api.bible oldalról származik. Csak akkor szükséges, ha az API.Bible szolgáltató engedélyezve van."
LIB_CWMSCRIPTURE_GET_API_KEY="API-kulcs beszerzése"
LIB_CWMSCRIPTURE_SYNC_TRANSLATIONS="Fordítások szinkronizálása"
LIB_CWMSCRIPTURE_BIBLEBRAIN_LABEL="Biblia agy szolgáltató engedélyezése"
LIB_CWMSCRIPTURE_BIBLEBRAIN_DESC="Használd a Bible Brain (Faith Comes By Hearing) API-t. Szöveges és hangos Bibliát biztosít több mint 2500 nyelven. Ingyenes a szolgálathoz. API-kulcs szükséges."
LIB_CWMSCRIPTURE_BIBLEBRAIN_APIKEY_LABEL="Biblia agy API kulcs"
LIB_CWMSCRIPTURE_BIBLEBRAIN_APIKEY_DESC="Az Ön API-kulcsa a faithcomesbyhearing.com oldalról. Csak akkor szükséges, ha a Bible Brain szolgáltató engedélyezve van."
LIB_CWMSCRIPTURE_BIBLEBRAIN_GET_KEY="Szerezd meg a Bible Brain API kulcsot"

