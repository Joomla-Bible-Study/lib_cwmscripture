; CWM Scripture Library - Admin strings
; Used by TranslationsmanagerField for the scripture management UI

; Section titles
LIB_CWMSCRIPTURE_PROVIDERS_TITLE="Bijbelleveranciers"
LIB_CWMSCRIPTURE_PROVIDERS_DESC="Schakel externe aanbieders van Bijbelteksten in of uit. Er is ten minste één aanbieder (of lokale vertalingen) nodig voor het opzoeken van Bijbelteksten."
LIB_CWMSCRIPTURE_SETTINGS_TITLE="Schriftverwijzingen"

; Provider fields
LIB_CWMSCRIPTURE_GETBIBLE_LABEL="Schakel de GetBible.net-provider in."
LIB_CWMSCRIPTURE_GETBIBLE_DESC="Gebruik de gratis GetBible.net API voor het opzoeken van Bijbelteksten. Ondersteunt meer dan 100 vertalingen. Geen API-sleutel nodig."
LIB_CWMSCRIPTURE_APIBIBLE_LABEL="API inschakelen.Bible-provider"
LIB_CWMSCRIPTURE_APIBIBLE_DESC="Gebruik de API van API.Bible (American Bible Society). Deze biedt toegang tot auteursrechtelijk beschermde vertalingen zoals de NIV, ESV en NLT. Een API-sleutel is vereist."
LIB_CWMSCRIPTURE_APIKEY_LABEL="API.Bijbel API-sleutel"
LIB_CWMSCRIPTURE_APIKEY_DESC="Uw API-sleutel van scripture.api.bible. Alleen vereist als de API.Bible-provider is ingeschakeld."
LIB_CWMSCRIPTURE_GET_API_KEY="API-sleutel verkrijgen"
LIB_CWMSCRIPTURE_SYNC_TRANSLATIONS="Vertalingen synchroniseren"
LIB_CWMSCRIPTURE_BIBLEBRAIN_LABEL="Schakel de Bijbel Brain-provider in"
LIB_CWMSCRIPTURE_BIBLEBRAIN_DESC="Gebruik de Bible Brain (Faith Comes By Hearing) API. Biedt tekst- en audiobijbels in meer dan 2500 talen. Gratis te gebruiken voor kerkelijk gebruik. Vereist een API-sleutel."
LIB_CWMSCRIPTURE_BIBLEBRAIN_APIKEY_LABEL="API-sleutel voor Bible Brain"
LIB_CWMSCRIPTURE_BIBLEBRAIN_APIKEY_DESC="Uw API-sleutel van faithcomesbyhearing.com. Alleen vereist als de Bible Brain-provider is ingeschakeld."
LIB_CWMSCRIPTURE_BIBLEBRAIN_GET_KEY="Ontvang een API-sleutel voor Bible Brain"

; Settings fields
LIB_CWMSCRIPTURE_VERSION_LABEL="Standaard Bijbelversie"
LIB_CWMSCRIPTURE_VERSION_DESC="Standaard afkorting voor Bijbelvertalingen (bijv. kjv, web, nlt). Kan per tag worden overschreven: {scripture kjv}Johannes 3:16{/scripture}."
LIB_CWMSCRIPTURE_CACHE_LABEL="Cacheduur (dagen)"
LIB_CWMSCRIPTURE_CACHE_DESC="Aantal dagen dat bijbelpassages, opgehaald via externe API's, in de cache worden opgeslagen."

