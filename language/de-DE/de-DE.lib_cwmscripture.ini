; CWM Scripture Library - Admin strings
; Used by TranslationsmanagerField for the scripture management UI

; Section titles
LIB_CWMSCRIPTURE_PROVIDERS_TITLE="Bibelanbieter"
LIB_CWMSCRIPTURE_PROVIDERS_DESC="Externe Bibeltextanbieter aktivieren oder deaktivieren. Für Bibelstellenrecherchen wird mindestens ein Anbieter (oder eine lokale Übersetzung) benötigt."
LIB_CWMSCRIPTURE_SETTINGS_TITLE="Bibeltexte"

; Provider fields
LIB_CWMSCRIPTURE_GETBIBLE_LABEL="GetBible.net-Anbieter aktivieren"
LIB_CWMSCRIPTURE_GETBIBLE_DESC="Nutzen Sie die kostenlose GetBible.net-API für Bibelstellenrecherchen. Unterstützt über 100 Übersetzungen. Kein API-Schlüssel erforderlich."
LIB_CWMSCRIPTURE_APIBIBLE_LABEL="API.Bible-Anbieter aktivieren"
LIB_CWMSCRIPTURE_APIBIBLE_DESC="Nutzen Sie die API.Bible (American Bible Society). Sie bietet Zugriff auf urheberrechtlich geschützte Übersetzungen wie NIV, ESV und NLT. Ein API-Schlüssel ist erforderlich."
LIB_CWMSCRIPTURE_APIKEY_LABEL="API.Bible API-Schlüssel"
LIB_CWMSCRIPTURE_APIKEY_DESC="Ihr API-Schlüssel von scripture.api.bible. Nur erforderlich, wenn der API.Bible-Anbieter aktiviert ist."
LIB_CWMSCRIPTURE_GET_API_KEY="API-Schlüssel abrufen"
LIB_CWMSCRIPTURE_SYNC_TRANSLATIONS="Übersetzungen synchronisieren"
LIB_CWMSCRIPTURE_BIBLEBRAIN_LABEL="Bibel-Gehirn-Anbieter aktivieren"
LIB_CWMSCRIPTURE_BIBLEBRAIN_DESC="Nutzen Sie die API von Bible Brain (Faith Comes By Hearing). Sie bietet Text- und Audioversionen der Bibel in über 2.500 Sprachen. Kostenlos für kirchliche Zwecke. Ein API-Schlüssel ist erforderlich."
LIB_CWMSCRIPTURE_BIBLEBRAIN_APIKEY_LABEL="Bible Brain API-Schlüssel"
LIB_CWMSCRIPTURE_BIBLEBRAIN_APIKEY_DESC="Ihr API-Schlüssel von faithcomesbyhearing.com. Nur erforderlich, wenn der Bible Brain-Anbieter aktiviert ist."
LIB_CWMSCRIPTURE_BIBLEBRAIN_GET_KEY="Bible Brain API-Schlüssel abrufen"

; Settings fields
LIB_CWMSCRIPTURE_VERSION_LABEL="Standard-Bibelversion"
LIB_CWMSCRIPTURE_VERSION_DESC="Standardmäßige Abkürzung der Bibelübersetzung (z. B. kjv, web, nlt). Kann pro Tag überschrieben werden: {scripture kjv}Johannes 3:16{/scripture}."
LIB_CWMSCRIPTURE_CACHE_LABEL="Cache-Dauer (Tage)"
LIB_CWMSCRIPTURE_CACHE_DESC="Anzahl der Tage, für die von externen APIs abgerufene Bibelstellen zwischengespeichert werden."

; Local translations panel
LIB_CWMSCRIPTURE_LOCAL_TRANSLATIONS="Lokale Übersetzungen"
LIB_CWMSCRIPTURE_LOCAL_TRANSLATIONS_DESC="Laden Sie Bibelübersetzungen zur Offline-Nutzung herunter. Heruntergeladene Übersetzungen werden lokal gespeichert und benötigen keine externen API-Aufrufe."

