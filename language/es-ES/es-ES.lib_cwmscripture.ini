; CWM Scripture Library - Admin strings
; Used by TranslationsmanagerField for the scripture management UI

; Section titles
LIB_CWMSCRIPTURE_PROVIDERS_TITLE="Proveedores de Biblias"
LIB_CWMSCRIPTURE_PROVIDERS_DESC="Habilite o deshabilite los proveedores externos de textos bíblicos. Se necesita al menos un proveedor (o traducciones locales) para la búsqueda de versículos bíblicos."
LIB_CWMSCRIPTURE_SETTINGS_TITLE="Configuración de las Escrituras"

; Provider fields
LIB_CWMSCRIPTURE_GETBIBLE_LABEL="Habilitar el proveedor GetBible.net"
LIB_CWMSCRIPTURE_GETBIBLE_DESC="Utilice la API gratuita de GetBible.net para consultar pasajes bíblicos. Admite más de 100 traducciones. No se necesita clave API."
LIB_CWMSCRIPTURE_APIBIBLE_LABEL="Habilitar el proveedor API.Bible"
LIB_CWMSCRIPTURE_APIBIBLE_DESC="Utilice la API de API.Bible (Sociedad Bíblica Americana). Proporciona acceso a traducciones con derechos de autor como la NVI, la ESV y la NLT. Requiere una clave API."
LIB_CWMSCRIPTURE_APIKEY_LABEL="Clave API de API.Bible"
LIB_CWMSCRIPTURE_APIKEY_DESC="Su clave API de scripture.api.bible. Solo es necesaria si el proveedor API.Bible está habilitado."
LIB_CWMSCRIPTURE_GET_API_KEY="Obtén la clave API"
LIB_CWMSCRIPTURE_SYNC_TRANSLATIONS="Sincronizar traducciones"
LIB_CWMSCRIPTURE_BIBLEBRAIN_LABEL="Habilitar proveedor de cerebro bíblico"
LIB_CWMSCRIPTURE_BIBLEBRAIN_DESC="Utilice la API de Bible Brain (La fe viene por oír). Ofrece la Biblia en texto y audio en más de 2500 idiomas. Gratuita para uso ministerial. Requiere una clave API."
LIB_CWMSCRIPTURE_BIBLEBRAIN_APIKEY_LABEL="Clave API de Bible Brain"
LIB_CWMSCRIPTURE_BIBLEBRAIN_APIKEY_DESC="Su clave API de faithcomesbyhearing.com. Solo es necesaria si el proveedor Bible Brain está habilitado."
LIB_CWMSCRIPTURE_BIBLEBRAIN_GET_KEY="Obtén la clave API de Bible Brain"

; Settings fields
LIB_CWMSCRIPTURE_VERSION_LABEL="Versión de la Biblia predeterminada"
LIB_CWMSCRIPTURE_VERSION_DESC="Abreviatura predeterminada de la traducción bíblica (p. ej., kjv, web, nlt). Se puede modificar mediante la etiqueta: {scripture kjv}Juan 3:16{/scripture}."
LIB_CWMSCRIPTURE_CACHE_LABEL="Duración de la caché (días)"
LIB_CWMSCRIPTURE_CACHE_DESC="Número de días que se deben almacenar en caché los pasajes bíblicos obtenidos de API externas."

; Local translations panel
LIB_CWMSCRIPTURE_LOCAL_TRANSLATIONS="Traducciones locales"
LIB_CWMSCRIPTURE_LOCAL_TRANSLATIONS_DESC="Descarga traducciones de la Biblia para usarlas sin conexión. Las traducciones descargadas se almacenan localmente y no requieren llamadas a la API externa."

