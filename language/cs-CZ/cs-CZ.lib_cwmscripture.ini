LIB_CWMSCRIPTURE_SYNC_TRANSLATIONS="Synchronizace překladů"
LIB_CWMSCRIPTURE_BIBLEBRAIN_LABEL="Povolit poskytovatele Bible Brain"
LIB_CWMSCRIPTURE_BIBLEBRAIN_DESC="Použijte API Bible Brain (víra přichází ze slyšení). Poskytuje textovou a audio Bibli ve více než 2 500 jazycích. Zdarma pro duchovní použití. Vyžaduje klíč API."
LIB_CWMSCRIPTURE_BIBLEBRAIN_APIKEY_LABEL="Klíč API Bible Brain"
LIB_CWMSCRIPTURE_BIBLEBRAIN_APIKEY_DESC="Váš klíč API z webu faithcomesbyhearing.com. Vyžadováno pouze v případě, že je povolen poskytovatel Bible Brain."
LIB_CWMSCRIPTURE_BIBLEBRAIN_GET_KEY="Získejte klíč API Bible Brain"

