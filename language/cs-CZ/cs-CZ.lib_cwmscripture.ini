; Provider fields
LIB_CWMSCRIPTURE_GETBIBLE_LABEL="Povolit poskytovatele GetBible.net"
LIB_CWMSCRIPTURE_GETBIBLE_DESC="Použijte bezplatné API GetBible.net pro vyhledávání v Písmu. Podporuje více než 100 překladů. Není potřeba žádný klíč API."
LIB_CWMSCRIPTURE_APIBIBLE_LABEL="Povolit poskytovatele API.Bible"
LIB_CWMSCRIPTURE_APIBIBLE_DESC="Použijte API API.Bible (American Bible Society). Poskytuje přístup k autorsky chráněným překladům, jako jsou NIV, ESV, NLT. Vyžaduje klíč API."
LIB_CWMSCRIPTURE_APIKEY_LABEL="Klíč API API.Bible API"
LIB_CWMSCRIPTURE_APIKEY_DESC="Váš klíč API ze souboru scripture.api.bible. Vyžadováno pouze v případě, že je povolen poskytovatel API.Bible."
