LIB_CWMSCRIPTURE_VERSION_DESC="Výchozí zkratka biblického překladu (např. kjv, web, nlt). Lze ji přepsat pro každý tag: {scripture kjv}Jan 3:16{/scripture}."
LIB_CWMSCRIPTURE_CACHE_LABEL="Doba trvání mezipaměti (dny)"
LIB_CWMSCRIPTURE_CACHE_DESC="Počet dní pro ukládání pasáží z písem do mezipaměti načtených z externích API."

