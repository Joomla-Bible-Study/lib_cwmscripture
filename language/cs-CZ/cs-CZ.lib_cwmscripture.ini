; Section titles
LIB_CWMSCRIPTURE_PROVIDERS_TITLE="Poskytovatelé Bible"
LIB_CWMSCRIPTURE_PROVIDERS_DESC="Povolte nebo zakažte externí poskytovatele biblických textů. Pro vyhledávání v Písmu je potřeba alespoň jeden poskytovatel (nebo místní překlady)."
