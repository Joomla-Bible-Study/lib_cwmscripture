name: CI

# The lint, test and build steps live in cwm-build-tools so every CWM
# extension runs the same pipeline and a fix lands everywhere at once. What
# stays here is what is genuinely this repository's own: when CI runs, and
# the one value that differs from the shared defaults.
#
# The reusable workflow is .github/workflows/joomla-library-ci.yml in
# Joomla-Bible-Study/cwm-build-tools. To see what the inputs do, or to change
# a step, edit it there.
#
# It orders npm after `composer install` on purpose: the rollup and build-css
# templates the asset build depends on ship inside vendor/cwm/build-tools, so
# `npm run build` cannot run before Composer has put them there — and it has
# to run before packaging or the zip carries stale media. That ordering is
# why libraries get their own workflow rather than a flag on the package one.

on:
  push:
    branches: [ "main", "master", "development" ]
    paths-ignore:
      - '**.md'
      - 'language/**'
      - 'build/.source_cache.json'
      - 'build/.translation_cache.json'
  pull_request:
    branches: [ "main", "master", "development" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: PHP Lint & Tests
    # `v1` is a moving tag on cwm-build-tools, re-pointed at each release —
    # the CI equivalent of the `^1.9.0` Composer constraint in composer.json.
    uses: Joomla-Bible-Study/cwm-build-tools/.github/workflows/joomla-library-ci.yml@v1.9.1
    with:
      # Everything else is a shared default and deliberately left unset:
      # PHP 8.3, Node 24, no submodules, npm asset build on, and `php -l`
      # over src/ and tests/ because this project has no lint:syntax script.
      # Those defaults were drawn from this repository's own pipeline, so
      # leaving them implicit is what keeps it in step with the others.
      build-command: 'composer build:package'